
plugins {
    id("kotlin-kapt")
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
    id("org.jetbrains.kotlin.plugin.serialization") version "2.0.0"
    id 'kotlin-parcelize'
    id("org.jetbrains.kotlin.plugin.compose") version "2.0.0-RC3"
}

android {
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId "ru.be_more.orange_forum"
        minSdk 24
        targetSdk 34
        versionCode 12
        versionName "0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    sourceSets {
        main {
            assets {
                srcDirs 'src/main/assets', 'src/main/assets/www'
            }
        }
    }
    buildFeatures {
        viewBinding = true
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = "2.0.0"
    }
    namespace 'ru.be_more.orange_forum'
    buildToolsVersion '33.0.2'

}

dependencies {
    //Android smth
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation "androidx.preference:preference-ktx:1.2.1"
    implementation "androidx.legacy:legacy-support-v4:1.0.0"

    //Compose
    def composeBom = platform('androidx.compose:compose-bom:2024.06.00')
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material:1.6.8'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.2'

    //todo delete?
    //swipe
    implementation "me.saket.swipe:swipe:1.1.1"

    // Android Studio Preview support
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    // UI Tests
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    //Navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.7'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.7'
    implementation "androidx.navigation:navigation-dynamic-features-fragment:2.7.7"
    implementation "androidx.navigation:navigation-compose:2.8.0-beta03"

    //dagger
    implementation 'com.google.dagger:dagger:2.51.1'
    implementation 'com.google.dagger:dagger-android:2.51.1'
    kapt 'com.google.dagger:dagger-android-processor:2.51.1'
    kapt 'com.google.dagger:dagger-compiler:2.51.1'

    //Room
    implementation "androidx.room:room-ktx:2.6.1"

    //Retrofit2
    implementation "com.squareup.retrofit2:retrofit:2.9.0"

    //Okhttp3
    implementation "com.squareup.okhttp3:okhttp:4.11.0"
    implementation "com.squareup.okhttp3:logging-interceptor:3.12.1"

    //junit
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    //Glide
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation "com.github.bumptech.glide:compose:1.0.0-alpha.5"

    //todo delete?
    //scalable image view
    implementation 'com.github.thijsk:TouchImageView:1.3.1'

    //leak tracer
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.12'

    //Work Manager
    implementation("androidx.work:work-runtime:2.9.0")
    implementation("androidx.work:work-runtime-ktx:2.9.0")
    implementation("androidx.work:work-rxjava2:2.9.0")

    //HTML parsing for compose
    implementation "com.github.DmytroShuba:DailyTags:1.0.0"

    implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.0-RC")

    implementation(project(":database"))
    implementation(project(":network"))
    implementation(project(":ui"))
    implementation(project(":model"))
    implementation(project(":resources"))
}
